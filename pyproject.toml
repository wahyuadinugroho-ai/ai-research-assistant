[project]
name = "ai-research-assistant"
version = "1.0.0"
description = "An agentic RAG-powered research assistant for analyzing and comparing academic papers using Google Gemini."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "exa-py>=2.17.0",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "nltk>=3.10.2",
    "onnxruntime<=1.19.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]
